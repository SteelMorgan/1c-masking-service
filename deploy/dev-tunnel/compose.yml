# Пример для тестового стенда. Значения задаются через ENV (см. .env.example рядом).
name: ${TUNNEL_COMPOSE_PROJECT:-onec-v8sm-dev-tunnel}

services:
  reverse-tunnel:
    image: "${ONEC_V8SM_TUNNEL_IMAGE:-ssh-client-image:latest}"
    container_name: ${TUNNEL_CONTAINER_NAME:-onec-v8sm-dev-tunnel}
    user: "${TUNNEL_UID:-1000}:${TUNNEL_GID:-1000}"
    init: true
    restart: unless-stopped
    network_mode: "container:${MANAGER_CONTAINER:-manager-container}"
    read_only: true
    # Образ используется как носитель OpenSSH; его init-скрипт пишет в /etc и несовместим с read-only rootfs.
    entrypoint:
      - /usr/bin/ssh
    command:
      - -F
      - /dev/null
      - -i
      - /run/onec-v8sm-dev/id_ed25519
      - -o
      - IdentitiesOnly=yes
      - -o
      - UserKnownHostsFile=/run/onec-v8sm-dev/known_hosts
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - ExitOnForwardFailure=yes
      - -o
      - ServerAliveInterval=15
      - -o
      - ServerAliveCountMax=3
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=10
      - -N
      - -T
      - -R
      - 127.0.0.1:${TUNNEL_REMOTE_PORT:-4000}:127.0.0.1:${MANAGER_PORT:-4000}
      - ${TUNNEL_SSH_USER:-tunnel-user}@${ONEC_HOST:-onec-host}
    volumes:
      - type: volume
        source: tunnel-secrets
        target: /run/onec-v8sm-dev
        read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  tunnel-secrets:
    external: true
    name: ${TUNNEL_SECRETS_VOLUME:-onec-v8sm-dev-tunnel-secrets}
